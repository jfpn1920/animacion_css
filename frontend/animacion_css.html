<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>animacion css</title>
    <link rel="stylesheet" href="animacion_css.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css">
    <script src="animacion_css.js" defer></script>
</head>
<body>
    <!---------------------------------->
    <!--|estructuracion_animacion_css|-->
    <!---------------------------------->
    <main class="app">
        <header class="encabezado">
            <h1>Animación CSS</h1>
            <p>Una figura que se mueve con animaciones hechas solo con CSS.</p>
        </header>
        <!---------------------------->
        <!--|escenario_de_animacion|-->
        <!---------------------------->
        <section id="escenario" class="escenario" aria-label="Escenario de animación">
            <div id="figura" class="figura"></div>
        </section>
        <!------------------------>
        <!--|panel_de_controles|-->
        <!------------------------>
        <section class="panel">
            <h2>Controles</h2>
            <form id="controles" onsubmit="return false">
                <div class="fila">
                    <div class="campo">
                        <label for="forma">Forma</label>
                        <select id="forma">
                            <option value="circulo">Círculo</option>
                            <option value="cuadrado">Cuadrado</option>
                            <option value="triangulo">Triángulo</option>
                        </select>
                    </div>
                    <div class="campo">
                        <label for="movimiento">Movimiento</label>
                        <select id="movimiento">
                            <option value="horizontal">Ir y volver</option>
                            <option value="vertical">Subir y bajar</option>
                            <option value="giro">Girar</option>
                            <option value="orbita">Órbita</option>
                        </select>
                    </div>
                </div>
                <!----------------------------------->
                <!--|seleccion_de_color_y_duracion|-->
                <!----------------------------------->
                <div class="fila">
                    <div class="campo">
                        <label for="color">Color</label>
                        <input type="color" id="color">
                    </div>
                    <div class="campo">
                        <label for="duracion">
                            Duración: <span id="duracionTexto">3 s</span>
                        </label>
                        <input type="range" id="duracion" min="1" max="8" step="0.5">
                    </div>
                </div>
            </form>
            <!----------------------->
            <!--|botones_de_accion|-->
            <!----------------------->
            <div class="botones">
                <button id="btnPausa" class="boton" type="button">Pausar</button>
                <button id="btnRestablecer" class="boton-claro" type="button">Restablecer</button>
            </div>
        </section>
    </main>
</body>
</html>
